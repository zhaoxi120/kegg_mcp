name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_kegg_live:
        description: Run the explicitly authorized four-request KEGG campaign
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEGG_MCP_ACCESS_MODE: offline_cache

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Synchronize locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen pyright

      - name: Test
        run: uv run --frozen pytest

  validate-deepkoala-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: companions/deepkoala-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-dependency-glob: "companions/deepkoala-mcp/uv.lock"
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Synchronize companion locked environment
        run: uv sync --frozen

      - name: Lint companion
        run: uv run --frozen ruff check .

      - name: Check companion formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check companion
        run: uv run --frozen pyright

      - name: Test companion
        run: uv run --frozen pytest

  validate-kegg-live:
    name: Validate bounded KEGG live compatibility
    needs:
      - validate
      - validate-deepkoala-companion
    if: >-
      vars.KEGG_MCP_LIVE_TESTS_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_kegg_live == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: kegg-live
    concurrency:
      group: kegg-live-api
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Synchronize locked environment
        run: uv sync --frozen

      - name: Run four-request KEGG compatibility check
        env:
          KEGG_MCP_ACCESS_MODE: ${{ vars.KEGG_MCP_ACCESS_MODE }}
          KEGG_MCP_ACADEMIC_USE_CONFIRMED: ${{ vars.KEGG_MCP_ACADEMIC_USE_CONFIRMED }}
          KEGG_MCP_LICENSED_ENDPOINT: ${{ secrets.KEGG_MCP_LICENSED_ENDPOINT }}
          KEGG_MCP_LICENSED_USE_CONFIRMED: ${{ vars.KEGG_MCP_LICENSED_USE_CONFIRMED }}
        run: >-
          uv run --frozen pytest
          tests/live/test_kegg_api_live.py
          --run-kegg-live
          -m live_kegg
          -q
