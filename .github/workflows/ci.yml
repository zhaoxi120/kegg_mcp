name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEGG_MCP_ACCESS_MODE: public_academic
      KEGG_MCP_ACADEMIC_USE_CONFIRMED: "true"
      KEGG_MCP_RUN_LIVE_TESTS: "true"
      KEGG_MCP_LIVE_REQUESTS_PER_OPERATION: "20"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen pyright

      - name: Test, including at most 120 live KEGG requests
        run: uv run --frozen pytest

      - name: Build core distributions
        run: uv build --no-sources --out-dir "${RUNNER_TEMP}/kegg-mcp-dist"

      - name: Smoke-test installed core wheel
        run: >-
          python tests/release/smoke_wheel.py
          --wheel "${RUNNER_TEMP}"/kegg-mcp-dist/kegg_mcp-*.whl
          --distribution kegg-mcp
          --module kegg_mcp
          --expected-version 0.10.0
          --console kegg-mcp

  validate-deepkoala-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: companions/deepkoala-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-dependency-glob: "companions/deepkoala-mcp/uv.lock"
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Synchronize companion locked environment
        run: uv sync --locked

      - name: Lint companion
        run: uv run --frozen ruff check .

      - name: Check companion formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check companion
        run: uv run --frozen pyright

      - name: Test companion
        run: uv run --frozen pytest

      - name: Build independent DeepKOALA distributions
        run: uv build --no-sources --out-dir "${RUNNER_TEMP}/deepkoala-mcp-dist"

      - name: Smoke-test installed DeepKOALA wheel
        run: >-
          python ../../tests/release/smoke_wheel.py
          --wheel "${RUNNER_TEMP}"/deepkoala-mcp-dist/deepkoala_mcp-*.whl
          --distribution deepkoala-mcp
          --module deepkoala_mcp
          --expected-version 0.5.0
          --console deepkoala-mcp

  validate-renderer-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: companions/kegg-render-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-dependency-glob: |
            companions/kegg-render-mcp/uv.lock
            uv.lock
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Synchronize renderer locked environment
        run: uv sync --locked --all-groups

      - name: Lint renderer
        run: uv run --frozen ruff check .

      - name: Check renderer formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check renderer
        run: uv run --frozen pyright

      - name: Test renderer with synthetic assets
        run: uv run --frozen pytest

      - name: Build independent renderer distributions
        run: |
          uv build --no-sources --out-dir "${RUNNER_TEMP}/kegg-render-mcp-dist"
          uv build --no-sources --wheel --out-dir "${RUNNER_TEMP}/kegg-render-mcp-dist" ../..

      - name: Smoke-test installed renderer wheel
        run: >-
          python ../../tests/release/smoke_wheel.py
          --wheel "${RUNNER_TEMP}"/kegg-render-mcp-dist/kegg_mcp-*.whl
          --wheel "${RUNNER_TEMP}"/kegg-render-mcp-dist/kegg_render_mcp-*.whl
          --distribution kegg-render-mcp
          --module kegg_render_mcp
          --expected-version 0.5.0

  validate-macos-core:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      KEGG_MCP_ACCESS_MODE: offline_cache

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Require native Apple Silicon
        run: python -c "import platform; assert platform.machine() == 'arm64'"

      - name: Synchronize locked Core environment
        run: uv sync --locked

      - name: Validate native Darwin cache access on macOS
        run: >-
          uv run --frozen pytest
          tests/unit/kegg/test_cache.py::test_darwin_read_only_descriptor_connection_primitive

      - name: Validate Apple Silicon suite installer contracts on macOS
        run: >-
          uv run --frozen pytest
          tests/release/test_suite_installation.py::test_host_platform_profiles_cover_linux_and_native_apple_silicon
          tests/release/test_suite_installation.py::test_deployment_environment_emits_platform_specific_deepkoala_devices
          tests/release/test_suite_installation.py::test_runtime_verification_accepts_cpu_only_local_ready_for_each_platform
          tests/release/test_suite_installation.py::test_python_preflight_requires_a_native_runtime_matching_the_host_profile

      - name: Build Core wheel on macOS
        run: uv build --no-sources --wheel --out-dir "${RUNNER_TEMP}/kegg-mcp-macos-dist"

      - name: Smoke-test installed Core wheel on macOS
        run: >-
          python tests/release/smoke_wheel.py
          --wheel "${RUNNER_TEMP}"/kegg-mcp-macos-dist/kegg_mcp-*.whl
          --distribution kegg-mcp
          --module kegg_mcp
          --expected-version 0.10.0
          --console kegg-mcp

  validate-macos-deepkoala-companion:
    runs-on: macos-14
    timeout-minutes: 15

    defaults:
      run:
        working-directory: companions/deepkoala-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-dependency-glob: "companions/deepkoala-mcp/uv.lock"
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Require native Apple Silicon
        run: python -c "import platform; assert platform.machine() == 'arm64'"

      - name: Synchronize companion locked environment
        run: uv sync --locked

      - name: Test companion process and filesystem behavior on macOS
        run: >-
          uv run --frozen pytest
          tests/test_runner.py::test_runner_times_out_and_reaps_process_group
          tests/test_runner.py::test_parent_sigkill_terminates_deepkoala_child
          tests/test_job_storage.py::test_shared_state_root_coordinates_runner_lock_across_spawned_processes

      - name: Build independent DeepKOALA distributions on macOS
        run: uv build --no-sources --out-dir "${RUNNER_TEMP}/deepkoala-mcp-macos-dist"

      - name: Smoke-test installed DeepKOALA wheel on macOS
        run: >-
          python ../../tests/release/smoke_wheel.py
          --wheel "${RUNNER_TEMP}"/deepkoala-mcp-macos-dist/deepkoala_mcp-*.whl
          --distribution deepkoala-mcp
          --module deepkoala_mcp
          --expected-version 0.5.0
          --console deepkoala-mcp

  validate-macos-renderer:
    runs-on: macos-14
    timeout-minutes: 15

    defaults:
      run:
        working-directory: companions/kegg-render-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-dependency-glob: |
            companions/kegg-render-mcp/uv.lock
            uv.lock
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Require native Apple Silicon
        run: python -c "import platform; assert platform.machine() == 'arm64'"

      - name: Synchronize locked renderer environment
        run: uv sync --locked --all-groups

      - name: Test renderer graphics and filesystem behavior on macOS
        run: >-
          uv run --frozen pytest
          tests/test_platform.py::test_supported_posix_host_satisfies_renderer_capability_gate
          tests/test_artifacts.py::test_parent_open_and_close_preserves_a_live_spawned_scope
          tests/test_synthetic_pipeline.py::test_fasta_handoff_accepted_ko_view_flows_into_safe_renderer_output

      - name: Build Core and renderer wheels on macOS
        run: |
          uv build --no-sources --wheel --out-dir "${RUNNER_TEMP}/kegg-render-macos-dist"
          uv build --no-sources --wheel --out-dir "${RUNNER_TEMP}/kegg-render-macos-dist" ../..

      - name: Smoke-test installed renderer wheel on macOS
        run: >-
          python ../../tests/release/smoke_wheel.py
          --wheel "${RUNNER_TEMP}"/kegg-render-macos-dist/kegg_mcp-*.whl
          --wheel "${RUNNER_TEMP}"/kegg-render-macos-dist/kegg_render_mcp-*.whl
          --distribution kegg-render-mcp
          --module kegg_render_mcp
          --expected-version 0.5.0

  validate-windows-unsupported:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Build native-Windows diagnostic wheels
        shell: pwsh
        run: |
          uv build --no-sources --wheel --out-dir "$env:RUNNER_TEMP/kegg-mcp-windows-dist"
          uv build --no-sources --wheel --out-dir "$env:RUNNER_TEMP/kegg-mcp-windows-dist" companions/kegg-render-mcp

      - name: Smoke-test installed Core wheel and structured unsupported-platform diagnostic
        shell: pwsh
        run: |
          $coreWheel = (Get-ChildItem "$env:RUNNER_TEMP/kegg-mcp-windows-dist/kegg_mcp-*.whl").FullName
          python tests/release/smoke_wheel.py --wheel $coreWheel --distribution kegg-mcp --module kegg_mcp --expected-version 0.10.0 --console kegg-mcp --native-windows-probe core

      - name: Smoke-test installed renderer wheel and static unsupported-platform diagnostic
        shell: pwsh
        run: |
          $coreWheel = (Get-ChildItem "$env:RUNNER_TEMP/kegg-mcp-windows-dist/kegg_mcp-*.whl").FullName
          $rendererWheel = (Get-ChildItem "$env:RUNNER_TEMP/kegg-mcp-windows-dist/kegg_render_mcp-*.whl").FullName
          python tests/release/smoke_wheel.py --wheel $coreWheel --wheel $rendererWheel --distribution kegg-render-mcp --module kegg_render_mcp --expected-version 0.5.0 --native-windows-probe renderer
