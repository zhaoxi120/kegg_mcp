name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEGG_MCP_ACCESS_MODE: public_academic
      KEGG_MCP_ACADEMIC_USE_CONFIRMED: "true"
      KEGG_MCP_RUN_LIVE_TESTS: "true"
      KEGG_MCP_LIVE_REQUESTS_PER_OPERATION: "5"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Synchronize locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen pyright

      - name: Test, including 20 live KEGG requests
        run: uv run --frozen pytest

  validate-deepkoala-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: companions/deepkoala-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-dependency-glob: "companions/deepkoala-mcp/uv.lock"
          enable-cache: true
          python-version: "3.11"
          version: "0.11.28"

      - name: Synchronize companion locked environment
        run: uv sync --frozen

      - name: Lint companion
        run: uv run --frozen ruff check .

      - name: Check companion formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check companion
        run: uv run --frozen pyright

      - name: Test companion
        run: uv run --frozen pytest
