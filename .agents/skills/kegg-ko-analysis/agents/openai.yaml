interface:
  display_name: "KEGG KO Analysis"
  short_description: "Analyze existing KO evidence with cautious KEGG logic"
  default_prompt: "Use $kegg-ko-analysis to normalize this existing KO evidence and evaluate the requested KEGG MODULEs or pathways."

dependencies:
  tools:
    - type: "mcp"
      value: "kegg-mcp"
      description: "Local KEGG KO analysis MCP server"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
