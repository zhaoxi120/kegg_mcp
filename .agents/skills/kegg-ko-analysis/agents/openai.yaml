interface:
  display_name: "KEGG KO Analysis"
  short_description: "Route KO evidence or a local-first annotation handoff"
  default_prompt: "Use $kegg-ko-analysis to analyze KO evidence, preferring the local DeepKOALA companion for protein FASTA and requesting permission before local installation or repair."

dependencies:
  tools:
    - type: "mcp"
      value: "kegg-mcp"
      description: "Local KEGG KO analysis MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
