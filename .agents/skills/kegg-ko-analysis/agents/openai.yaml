interface:
  display_name: "KEGG Query and KO Analysis"
  short_description: "Search KEGG entities and analyze existing KO evidence"
  default_prompt: "Use $kegg-ko-analysis to choose the smallest bounded KEGG query or KO-analysis route for this request."

dependencies:
  tools:
    - type: "mcp"
      value: "kegg-mcp"
      description: "Local bounded KEGG query and KO analysis MCP server"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
