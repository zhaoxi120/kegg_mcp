interface:
  display_name: "KEGG KO Analysis"
  short_description: "Route existing KO evidence through cautious KEGG analysis"
  default_prompt: "Use $kegg-ko-analysis to analyze these KO annotations with explicit provenance and conservative interpretation."

dependencies:
  tools:
    - type: "mcp"
      value: "kegg-mcp"
      description: "Local KEGG KO analysis MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
