interface:
  display_name: "KEGG Visualization"
  short_description: "Render KEGG pathway and MODULE evidence graphics"
  default_prompt: "Use $kegg-visualization to render these KO analysis results as conservative KEGG graphics."

dependencies:
  tools:
    - type: "mcp"
      value: "kegg-mcp"
      description: "Local KEGG KO analysis and renderer-handoff MCP server"
      transport: "stdio"
    - type: "mcp"
      value: "kegg-render-mcp"
      description: "Local KEGG pathway and MODULE renderer MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
